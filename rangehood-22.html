// tách tấm
for(const g of groups){ const gb=new THREE.Box3().setFromObject(g), gc=g.worldToLocal(gb.getCenter(new THREE.Vector3())), gs=gb.getSize(new THREE.Vector3());
  for(const c of g.children){ const b=new THREE.Box3().setFromObject(c); if(b.isEmpty())continue; const d=g.worldToLocal(b.getCenter(new THREE.Vector3())).sub(gc); d.set(d.x/Math.max(gs.x,1),d.y/Math.max(gs.y,1),d.z/Math.max(gs.z,1)).multiplyScalar(2); c.userData.p0=c.position.clone(); c.userData.td=d } }
let tach=0, mo=false;
document.getElementById('tach').oninput=e=>{ tach=e.target.value/100; for(const g of groups)for(const c of g.children)if(c.userData.p0)c.position.copy(c.userData.p0).addScaledVector(c.userData.td,tach*420) };
document.getElementById('bmo').onclick=e=>{ mo=!mo; e.target.classList.toggle('on',mo) };
let LG=document.documentElement.lang==='en'?'en':'vi'; const datLang=l=>{ LG=l; document.documentElement.lang=l; document.querySelectorAll('[data-vi]').forEach(e=>e.textContent=e.dataset[l]); document.getElementById('blg').textContent=l==='en'?'VI':'EN' };
document.getElementById('blg').onclick=()=>datLang(LG==='en'?'vi':'en'); datLang(LG);
document.getElementById('ban').onclick=e=>{ const an=e.target.classList.toggle('on'); root.traverse(o=>{ if(o.userData.canh)o.visible=!an }) };
function fit(){ const c=bb.getCenter(new THREE.Vector3()), t=Math.tan(cam.fov*Math.PI/360), asp=Math.max(cam.aspect,.3), need=Math.max((sz.y+sz.z*.35)/2/t,Math.hypot(sz.x,sz.z)/2/(t*asp))*1.2+600;
  ctl.target.copy(c); cam.position.copy(c).addScaledVector(HUONG,need); ctl.update() }
// nhìn từ phía MẶT CÁNH: trung bình hướng mặt trước các tủ (theo bề rộng), lệch ngang ~25°, hơi cao
const HUONG=(()=>{ let fx=0,fz=0; for(const t of D.tu){ if(['tam','mat_da'].includes(t.loai))continue; const g=t.goc*Math.PI/180; fx+=Math.sin(g)*t.w; fz+=Math.cos(g)*t.w }
  let L=Math.hypot(fx,fz); if(L<1){fx=0;fz=1;L=1} fx/=L; fz/=L; const a=25*Math.PI/180, rx=fx*Math.cos(a)+fz*Math.sin(a), rz=-fx*Math.sin(a)+fz*Math.cos(a);
  return new THREE.Vector3(rx,.42,rz).normalize() })();
document.getElementById('bfit').onclick=fit;
function size(){ const w=cv.clientWidth,h=cv.clientHeight; if(cv.width!==Math.floor(w*ren.getPixelRatio())||cv.height!==Math.floor(h*ren.getPixelRatio())){ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()} }
size(); fit();
(function loop(){ requestAnimationFrame(loop); size(); ctl.update();
  for(const a of anims){ const tg=mo?1:0; a.c=(a.c??0)+(tg-(a.c??0))*.14;
    if(a.t==='cua')a.o.rotation.y=a.s*a.c*1.75; else if(a.t==='gap')a.o.rotation.y=a.s*a.c*a.g; else if(a.t==='lat')a.o.rotation.x=a.s*a.c*1.4; else if(a.t==='latx')a.o.rotation.x=a.s*a.c*2.6; else if(a.t==='truot')a.o.position.x=a.x0+a.c*a.dx; else a.o.position.z=a.z0+a.c*Math.min(a.d*.72,420)*(1-.12*a.k)+(a.o.userData.td?a.o.userData.td.z*tach*420:0) }
  ren.render(scene,cam) })();
</script></body></html>
