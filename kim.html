  let L=Math.hypot(fx,fz); if(L<1){fx=0;fz=1;L=1} fx/=L; fz/=L; const a=25*Math.PI/180, rx=fx*Math.cos(a)+fz*Math.sin(a), rz=-fx*Math.sin(a)+fz*Math.cos(a);
  return new THREE.Vector3(rx,.42,rz).normalize() })();
